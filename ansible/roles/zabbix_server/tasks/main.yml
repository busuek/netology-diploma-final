---
- name: Install Zabbix repository
  apt:
    deb: "https://repo.zabbix.com/zabbix/6.4/ubuntu/pool/main/z/zabbix-release/zabbix-release_6.4-1+ubuntu22.04_all.deb"

- name: Update apt cache
  apt:
    update_cache: yes

- name: Install MySQL, Zabbix Server, Frontend, Agent
  apt:
    name:
      - mysql-server
      - zabbix-server-mysql
      - zabbix-frontend-php
      - zabbix-apache-conf
      - zabbix-sql-scripts
      - zabbix-agent
      - python3-pymysql
    state: present

- name: Start and enable MySQL
  service:
    name: mysql
    state: started
    enabled: yes

- name: Create Zabbix database
  community.mysql.mysql_db:
    name: zabbix
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create Zabbix user in MySQL
  community.mysql.mysql_user:
    name: zabbix
    password: "{{ vault_zabbix_db_password }}"
    priv: "zabbix.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Check if Zabbix schema is imported
  stat:
    path: /var/lib/mysql/zabbix/users.ibd
  register: zabbix_schema

- name: Import Zabbix schema
  shell: zcat /usr/share/zabbix-sql-scripts/mysql/server.sql.gz | mysql -uzabbix -p{{ vault_zabbix_db_password }} zabbix
  when: not zabbix_schema.stat.exists

- name: Configure Zabbix server DB connection
  lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^# DBPassword='
    line: 'DBPassword={{ vault_zabbix_db_password }}'
  notify: Restart Zabbix Server

- name: Configure Zabbix frontend DB connection
  template:
    src: zabbix.conf.php.j2
    dest: /etc/zabbix/web/zabbix.conf.php
    mode: '0644'

- name: Start and enable Zabbix Server
  service:
    name: zabbix-server
    state: started
    enabled: yes

- name: Start and enable Apache
  service:
    name: apache2
    state: started
    enabled: yes
